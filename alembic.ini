[alembic]
script_location = src/nirantar/db/migrations
prepend_sys_path = src
# URL comes from DATABASE_OWNER_URL (env.py); migrations run as the owner role.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
